    <path d="M-101 42C-39 101 46 97 103 35" fill="none" stroke="#fb7185" stroke-opacity="0.32" stroke-width="2"/>
    <circle cx="-101" cy="-34" r="5" fill="#fbbf24" filter="url(#softGlow)"/>
    <circle cx="102" cy="-35" r="5" fill="#f97316" filter="url(#softGlow)"/>

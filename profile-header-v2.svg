<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Yousef AbuBaker</title>
  <desc id="description">Computer Science student focused on software, artificial intelligence, and project leadership</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="58%" stop-color="#171411"/>
      <stop offset="100%" stop-color="#241812"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="softAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#background)"/>
  <path d="M815 0H1200V300H930C1015 225 1002 98 815 0Z" fill="#ffffff" opacity="0.025"/>
  <path d="M905 0H1200V300H1015C1085 220 1072 92 905 0Z" fill="#f97316" opacity="0.055"/>

  <rect x="68" y="54" width="7" height="192" rx="3.5" fill="url(#accent)"/>
  <rect x="108" y="53" width="152" height="30" rx="15" fill="#f6f1e8" opacity="0.09"/>
  <circle cx="126" cy="68" r="4" fill="#fbbf24"/>
  <text x="140" y="73" fill="#d6d3d1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">NABLUS / PALESTINE</text>

  <text x="108" y="139" fill="#faf7f2" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="0.2">Yousef AbuBaker</text>
